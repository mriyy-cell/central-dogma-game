<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セントラルドグマ・ファクトリー</title>
  <style>
    :root {
      --bg-color: #0d1326;
      --card-bg: #12192e;
      --accent-blue: #38bdf8;
      --accent-pink: #f43f5e;
      --accent-green: #10b981;
      --text-color: #f8fafc;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(244, 63, 94, 0.08) 0%, transparent 20%);
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 2rem;
      color: #38bdf8;
      text-align: center;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 25px;
      text-align: center;
    }

    /* リソース表示エリア */
    .dashboard {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 850px;
      margin-bottom: 20px;
    }

    .res-card {
      flex: 1;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      border: 3px solid transparent;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .res-card.blue {
      border-color: var(--accent-blue);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3), inset 0 0 10px rgba(56, 189, 248, 0.1);
    }

    .res-card.pink {
      border-color: var(--accent-pink);
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.3), inset 0 0 10px rgba(244, 63, 94, 0.1);
    }

    .res-card.green {
      border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.3), inset 0 0 10px rgba(16, 185, 129, 0.1);
    }

    .res-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      margin: 0 auto 10px auto;
      border: 2px solid currentColor;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      background: rgba(0,0,0,0.3);
    }

    .res-card.blue .icon-box { color: var(--accent-blue); }
    .res-card.pink .icon-box { color: var(--accent-pink); }
    .res-card.green .icon-box { color: var(--accent-green); }

    .res-value {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .res-rate {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* メインアクションボタン */
    .click-area {
      margin: 10px 0 25px 0;
      width: 100%;
      max-width: 450px;
    }

    .dna-btn {
      width: 100%;
      background: transparent;
      color: #38bdf8;
      border: 3px solid var(--accent-blue);
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .dna-btn:active {
      transform: scale(0.98);
      background: rgba(56, 189, 248, 0.15);
    }

    /* 強化・装置購入エリア */
    .shop-section {
      width: 100%;
      max-width: 850px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #e2e8f0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .item-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      border: 2px solid #334155;
    }

    .item-card.blue { border-color: var(--accent-blue); }
    .item-card.pink { border-color: var(--accent-pink); }
    .item-card.green { border-color: var(--accent-green); }

    .item-header {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .item-icon {
      width: 45px;
      height: 45px;
      min-width: 45px;
      border: 2px solid currentColor;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      background: rgba(0,0,0,0.3);
    }

    .item-card.blue .item-icon { color: var(--accent-blue); }
    .item-card.pink .item-icon { color: var(--accent-pink); }
    .item-card.green .item-icon { color: var(--accent-green); }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .item-desc {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.2;
    }

    .item-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
    }

    .item-level {
      font-size: 1.2rem;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }

    .buy-btn {
      flex: 1;
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      border: 2px solid var(--accent-green);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s;
    }

    .buy-btn:hover:not(:disabled) {
      background-color: rgba(16, 185, 129, 0.25);
    }

    .buy-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #475569;
      color: #94a3b8;
      background: transparent;
    }
  </style>
</head>
<body>

  <h1>セントラルドグマ・ファクトリー</h1>
  <div class="subtitle">DNA → RNA → タンパク質 の流れで生体分子を大量生産せよ！</div>

  <!-- リソース表示 -->
  <div class="dashboard">
    <div class="res-card blue">
      <div class="res-title">mRNA（核内）</div>
      <div class="icon-box">🧬</div>
      <div class="res-value" id="dna-count">0</div>
      <div class="res-rate">クリックで生成</div>
    </div>
    <div class="res-card pink">
      <div class="res-title">アミノ酸</div>
      <div class="icon-box">🔮</div>
      <div class="res-value" id="rna-count">0</div>
      <div class="res-rate"><span id="rna-rate">0</span> /秒</div>
    </div>
    <div class="res-card green">
      <div class="res-title">タンパク質（翻訳物）</div>
      <div class="icon-box">🧪</div>
      <div class="res-value" id="protein-count">0</div>
      <div class="res-rate"><span id="protein-rate">0</span> /秒</div>
    </div>
  </div>

  <!-- タップアクション -->
  <div class="click-area">
    <button class="dna-btn" id="click-btn">
      <span>🧬</span> DNAを転写 (mRNA合成)
    </button>
    <button class="dna-btn amino-btn" id="translate-btn" style="margin-top: 10px; border-color: var(--accent-pink); color: var(--accent-pink);">
      <span>🔮</span> mRNAから翻訳 (アミノ酸合成 +1 / コスト: 3 mRNA)
    </button>
    <button class="dna-btn protein-btn" id="fold-btn" style="margin-top: 10px; border-color: var(--accent-green); color: var(--accent-green);">
      <span>🧪</span> アミノ酸から折りたたみ (タンパク質合成 +1 / コスト: 1000 アミノ酸)
    </button>
  </div>

  <!-- 施設・酵素購入 -->
  <div class="shop-section">
    <div class="section-title">生体内システムの強化・自動化</div>
    <div class="grid">
      
      <!-- RNAポリメラーゼ -->
      <div class="item-card blue">
        <div class="item-header">
          <div class="item-icon">🦠</div>
          <div class="item-info">
            <div class="item-name">RNAポリメラーゼ</div>
            <div class="item-desc">DNAからmRNAへの転写を自動化・促進する酵素。</div>
          </div>
        </div>
        <div class="item-footer">
          <div class="item-level" id="pol-lv">0</div>
          <button class="buy-btn" id="buy-pol">
            レベルアップ<br>コスト: <span id="pol-cost">10</span> mRNA
          </button>
        </div>
      </div>

      <!-- リボソーム -->
      <div class="item-card pink">
        <div class="item-header">
          <div class="item-icon">💊</div>
          <div class="item-info">
            <div class="item-name">リボソーム</div>
            <div class="item-desc">mRNAの情報を読み取り、アミノ酸を結合してタンパク質を翻訳・合成する。</div>
          </div>
        </div>
        <div class="item-footer">
          <div class="item-level" id="ribo-lv">0</div>
          <button class="buy-btn" id="buy-ribo">
            レベルアップ<br>コスト: <span id="ribo-cost">10</span> アミノ酸
          </button>
        </div>
      </div>

      <!-- 分子シャペロン -->
      <div class="item-card green">
        <div class="item-header">
          <div class="item-icon">🔄</div>
          <div class="item-info">
            <div class="item-name">分子シャペロン</div>
            <div class="item-desc">タンパク質の折りたたみ(フォールディング)を助け、翻訳効率を上昇させる。</div>
          </div>
        </div>
        <div class="item-footer">
          <div class="item-level" id="chap-lv">0</div>
          <button class="buy-btn" id="buy-chap">
            レベルアップ<br>コスト: <span id="chap-cost">20</span> タンパク質
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
