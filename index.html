<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セントラルドグマ・ファクトリー</title>
  <style>
    :root {
      --bg-color: #0d1326;
      --card-bg: rgba(18, 25, 46, 0.85);
      --accent-blue: #38bdf8;
      --accent-pink: #f43f5e;
      --accent-green: #10b981;
      --text-color: #f8fafc;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      background-image: linear-gradient(rgba(13, 19, 38, 0.75), rgba(13, 19, 38, 0.85)), url('photos/bg_central_dogma.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-color);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 2.2rem;
      color: #38bdf8;
      text-align: center;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 25px;
      text-align: center;
    }

    /* リソース表示エリア */
    .dashboard {
      display: flex;
      gap: 15px;
      width: 100%;
      max-width: 850px;
      margin-bottom: 25px;
    }

    .res-card {
      flex: 1;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      border: 2px solid transparent;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .res-card.blue { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
    .res-card.pink { border-color: var(--accent-pink); box-shadow: 0 0 15px rgba(244, 63, 94, 0.2); }
    .res-card.green { border-color: var(--accent-green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }

    .res-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    /* 画像面積を4倍にするため、サイズを55px -> 110px に拡大 */
    .icon-box {
      width: 110px;
      height: 110px;
      margin: 0 auto 10px auto;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-box img {
      width: 90%;
      height: 90%;
      object-fit: contain;
    }

    .res-value {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .res-rate {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* 中央メインアクション（DNAアイコンタップエリア） */
    .main-click-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 10px 0 30px 0;
    }

    /* 画像面積を4倍にするため、サイズを160px -> 320px に拡大 */
    .dna-click-container {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(0,0,0,0) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
      user-select: none;
    }

    .dna-click-container:hover {
      transform: scale(1.05);
    }

    .dna-click-container:active {
      transform: scale(0.92);
    }

    /* 画像面積を4倍にするため、サイズを130px -> 260px に拡大 */
    .dna-click-img {
      width: 260px;
      height: 260px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.6));
      pointer-events: none;
    }

    .click-label {
      margin-top: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-blue);
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    /* アクションボタン（翻訳・折りたたみ） */
    .sub-action-area {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .action-btn {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(4px);
      border: 2px solid;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* 画像面積を4倍にするため、サイズを24px -> 48px に拡大 */
    .action-btn img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .action-btn.pink {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
    }

    .action-btn.green {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .action-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.2);
    }

    .action-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #475569 !important;
      color: #94a3b8 !important;
    }

    /* 強化・装置購入エリア */
    .shop-section {
      width: 100%;
      max-width: 850px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #e2e8f0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .item-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 14px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      border: 2px solid #334155;
    }

    .item-card.blue { border-color: var(--accent-blue); }
    .item-card.pink { border-color: var(--accent-pink); }
    .item-card.green { border-color: var(--accent-green); }

    .item-header {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    /* 画像面積を4倍にするため、サイズを48px -> 96px に拡大 */
    .item-icon {
      width: 96px;
      height: 96px;
      min-width: 96px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.4);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .item-icon img {
      width: 88%;
      height: 88%;
      object-fit: contain;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .item-desc {
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.3;
    }

    .item-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
    }

    .item-level {
      font-size: 1.2rem;
      font-weight: bold;
      min-width: 25px;
      text-align: center;
    }

    .buy-btn {
      flex: 1;
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      border: 2px solid var(--accent-green);
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s;
    }

    .buy-btn:hover:not(:disabled) {
      background-color: rgba(16, 185, 129, 0.3);
    }

    .buy-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #475569;
      color: #94a3b8;
      background: transparent;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .dashboard {
        flex-direction: column;
      }
      .dna-click-container {
        width: 220px;
        height: 220px;
      }
      .dna-click-img {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>
<body>

  <h1>セントラルドグマ・ファクトリー</h1>
  <div class="subtitle">DNA → RNA → タンパク質 の流れで生体分子を大量生産せよ！</div>

  <!-- リソース表示 -->
  <div class="dashboard">
    <div class="res-card blue">
      <div class="res-title">mRNA（核内）</div>
      <div class="icon-box"><img src="photos/icon_mrna.png" alt="mRNA"></div>
      <div class="res-value" id="dna-count">0</div>
      <div class="res-rate">+<span id="mrna-rate">0</span> /秒</div>
    </div>
    <div class="res-card pink">
      <div class="res-title">アミノ酸</div>
      <div class="icon-box"><img src="photos/icon_amino_acid.png" alt="アミノ酸"></div>
      <div class="res-value" id="rna-count">0</div>
      <div class="res-rate">+<span id="rna-rate">0</span> /秒</div>
    </div>
    <div class="res-card green">
      <div class="res-title">タンパク質（翻訳物）</div>
      <div class="icon-box"><img src="photos/icon_protein.png" alt="タンパク質"></div>
      <div class="res-value" id="protein-count">0</div>
      <div class="res-rate">+<span id="protein-rate">0</span> /秒</div>
    </div>
  </div>

  <!-- 中央メインタップエリア -->
  <div class="main-click-section">
    <div class="dna-click-container" id="dna-tap-area">
      <img src="photos/icon_dna.png" alt="DNA" class="dna-click-img">
    </div>
    <div class="click-label">タップして転写 (mRNA合成)</div>
  </div>

  <!-- サブアクションエリア -->
  <div class="sub-action-area">
    <button class="action-btn pink" id="translate-btn">
      <img src="photos/icon_amino_acid.png" alt=""> mRNAから手動翻訳 (アミノ酸 +1 / コスト: 3 mRNA)
    </button>
    <button class="action-btn green" id="fold-btn">
      <img src="photos/icon_protein.png" alt=""> アミノ酸から手動折りたたみ (タンパク質 +1 / コスト: 10 アミノ酸)
    </button>
  </div>

  <!-- 施設・酵素購入 -->
  <div class="shop-section">
    <div class="section-title">生体内システムの強化・自動化</div>
    <div class="grid">
      
      <!-- RNAポリメラーゼ -->
      <div class="item-card blue">
        <div class="item-header">
          <div class="item-icon"><img src="photos/icon_rna_pol.png" alt="RNAポリメラーゼ"></div>
          <div class="item-info">
            <div class="item-name">RNAポリメラーゼ</div>
            <div class="item-desc">DNAからmRNAへの転写を自動化（+1 mRNA/秒）</div>
          </div>
        </div>
        <div class="item-footer">
          <div class="item-level" id="pol-lv">0</div>
          <button class="buy-btn" id="buy-pol">
            購入<br>コスト: <span id="pol-cost">15</span> mRNA
          </button>
        </div>
      </div>

      <!-- リボソーム -->
      <div class="item-card pink">
        <div class="item-header">
          <div class="item-icon"><img src="photos/icon_ribosome.png" alt="リボソーム"></div>
          <div class="item-info">
            <div class="item-name">リボソーム</div>
            <div class="item-desc">mRNAを読み取りアミノ酸に自動変換（+5 アミノ酸/秒）</div>
          </div>
        </div>
        <div class="item-footer">
          <div class="item-level" id="ribo-lv">0</div>
          <button class="buy-btn" id="buy-ribo">
            購入<br>コスト: <span id="ribo-cost">20</span> アミノ酸
          </button>
        </div>
      </div>

      <!-- 分子シャペロン -->
      <div class="item-card green">
        <div class="item-header">
          <div class="item-icon"><img src="photos/icon_chaperone.png" alt="分子シャペロン"></div>
          <div class="item-info">
            <div class="item-name">分子シャペロン</div>
            <div class="item-desc">アミノ酸をタンパク質に正しく折りたたむ（+20 タンパク質/秒）</div>
          </div>
        </div>
        <div class="item-footer">
          <div class="item-level" id="chap-lv">0</div>
          <button class="buy-btn" id="buy-chap">
            購入<br>コスト: <span id="chap-cost">50</span> タンパク質
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
